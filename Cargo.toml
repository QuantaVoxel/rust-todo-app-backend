[package]
name = "todo-app"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".","migration"]

[dependencies]
dotenv = "0.15.0"
salvo = {version = "1.1.2" , features = ["full","affix-state"]}
scrutiny = "0.1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3.23"
sea-orm = { version = "2.0.4", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid" ] }
log = "0.4.35"
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"

migration = {path = "migration"}